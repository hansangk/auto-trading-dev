[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autogrid-lab"
version = "0.6.0"
description = "Parallel long-short one-minute strategy grid-search backtester"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
fast = ["numba>=0.61", "polars>=1.0", "pyarrow>=17"]
dev = ["pytest>=8"]

[project.scripts]
autogrid = "autogrid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

